version: "1"

# ==============================================================================
# CreditMera - Render Cloud Blueprint Specification (Infrastructure as Code)
# Services: PostgreSQL Database, FastAPI Backend Web Service, React Frontend Static Site
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # 1. Managed PostgreSQL Database Instance
  # ----------------------------------------------------------------------------
  - name: creditmera-db
    databaseName: creditmera_db
    user: creditmera
    plan: free

services:
  # ----------------------------------------------------------------------------
  # 2. FastAPI Application Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: creditmera-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: SECRET_KEY
        generateValue: true
      - key: WATERMARK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: creditmera-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage_data
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_CONTENT_LENGTH_BYTES
        value: "33554432"

  # ----------------------------------------------------------------------------
  # 3. React 18 / Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: creditmera-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: creditmera-backend
          property: url
