# ==============================================================================
# CreditMera - Production Multi-Container Orchestration
# Services: PostgreSQL 16, FastAPI Backend, Nginx Frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: creditmera-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: creditmera_db
      POSTGRES_USER: creditmera
      POSTGRES_PASSWORD: ${CREDITMERA_DB_PASSWORD:?CREDITMERA_DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditmera -d creditmera_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - creditmera-net
    # Do not expose ports to public host by default for defense-in-depth

  # ----------------------------------------------------------------------------
  # 2. FastAPI Application Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditmera-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://creditmera:${CREDITMERA_DB_PASSWORD:?CREDITMERA_DB_PASSWORD must be set in .env}@db:5432/creditmera_db
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env (min 32 chars)}
      WATERMARK_SECRET_KEY: ${WATERMARK_SECRET_KEY:?WATERMARK_SECRET_KEY must be set in .env (min 32 chars)}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_BASE_DIR: /app/storage_data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://frontend}
      MAX_CONTENT_LENGTH_BYTES: 33554432
    volumes:
      - storage_data:/app/storage_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - creditmera-net

  # ----------------------------------------------------------------------------
  # 3. Nginx Reverse Proxy & React Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: creditmera-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - creditmera-net

# ------------------------------------------------------------------------------
# Persistent Volumes & Internal Network
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: creditmera_postgres_data
  storage_data:
    name: creditmera_storage_data

networks:
  creditmera-net:
    name: creditmera_network
    driver: bridge
